name: ci

# Validation gate: the same checks CLAUDE.md asks for locally — bin/check,
# vitest, a fresh static/dist, and pytest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.14'
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - name: bin/check (ruff check + ruff format --check + ty + biome)
        run: bin/check
      - name: vitest
        run: npm test
      # Prod serves the committed bundle with no build step at boot, so a
      # static/src change without a rebuilt static/dist ships stale UI.
      - name: static/dist is up to date
        run: |
          npm run build
          git diff --exit-code --stat static/dist

  pytest:
    # macOS, not ubuntu: periscope only runs on macOS hosts, and the channel-shim
    # reconnect tests time out on Linux.
    runs-on: macos-latest
    env:
      # Worktree/git tests commit into scratch repos.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v7
      # tests/test_tmux_mirror.py and the open/spawn route tests drive a real tmux.
      - run: brew install tmux
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
