<svg data-limb="tentacle 16 10.2" data-limb-color="#7d62c9" data-hat="10 3 8" data-neck="10.5 4 16" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Jelly" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current> (and .mood-not-furious unless furious); hide the others. Default shown: calm. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
        <rect x="7" y="3" width="6" height="1" fill="#ab93ed"></rect>
        <rect x="5" y="4" width="10" height="1" fill="#ab93ed"></rect>
        <rect x="4" y="5" width="12" height="6" fill="#ab93ed"></rect>
        <rect x="4" y="11" width="12" height="1" fill="#7d62c9"></rect>
        <g fill="#7d62c9"><rect x="4" y="12" width="2" height="1"></rect><rect x="7.3" y="12" width="2" height="1"></rect><rect x="10.7" y="12" width="2" height="1"></rect><rect x="14" y="12" width="2" height="1"></rect></g>
        <g fill="#d4c6fa"><rect x="7" y="4" width="3" height="1"></rect><rect x="5" y="5" width="1" height="2"></rect><rect x="13" y="5" width="1" height="1"></rect><rect x="14" y="7" width="1" height="1"></rect></g>
        <g fill="#7d62c9">
          <animateTransform attributeName="transform" type="translate" values="0 0;0.6 0;0 0;-0.6 0" dur="1.4s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
          <rect x="6" y="13" width="1" height="2"></rect><rect x="5" y="15" width="1" height="2"></rect><rect x="6" y="17" width="1" height="1"></rect>
          <rect x="9.5" y="13" width="1" height="2"></rect><rect x="10.5" y="15" width="1" height="2"></rect><rect x="9.5" y="17" width="1" height="1"></rect>
          <rect x="13" y="13" width="1" height="2"></rect><rect x="14" y="15" width="1" height="2"></rect><rect x="13" y="17" width="1" height="1"></rect>
        </g>
        <rect x="7" y="7" width="2" height="2" fill="#2a1f45"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.9;0.95;1" dur="5s" repeatCount="indefinite"></animate><animate attributeName="y" values="7;7;8;7" keyTimes="0;0.9;0.95;1" dur="5s" repeatCount="indefinite"></animate></rect>
        <rect x="11" y="7" width="2" height="2" fill="#2a1f45"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.9;0.95;1" dur="5s" repeatCount="indefinite"></animate><animate attributeName="y" values="7;7;8;7" keyTimes="0;0.9;0.95;1" dur="5s" repeatCount="indefinite"></animate></rect>
        <g fill="#f3f5f8" class="mood-calm"><rect x="7" y="7" width="0.7" height="0.7"></rect><rect x="11" y="7" width="0.7" height="0.7"></rect></g>
        <g class="mood-calm"><rect x="8.4" y="9.6" width="0.7" height="0.7" fill="#2a1f45"></rect><rect x="9" y="10.2" width="2" height="0.7" fill="#2a1f45"></rect><rect x="10.9" y="9.6" width="0.7" height="0.7" fill="#2a1f45"></rect><rect x="5" y="9.2" width="1.5" height="0.8" fill="#f2a7c3"></rect><rect x="13.5" y="9.2" width="1.5" height="0.8" fill="#f2a7c3"></rect></g>
        <g fill="#2a1f45" class="mood-grumpy"><rect x="6.5" y="5.9" width="3" height="0.7"></rect><rect x="10.5" y="5.9" width="3" height="0.7"></rect><rect x="8.5" y="10" width="3" height="0.7"></rect></g>
        <g fill="#2a1f45" class="mood-furious"><rect x="6.4" y="5.5" width="1.6" height="0.7"></rect><rect x="8" y="6.1" width="1.6" height="0.7"></rect><rect x="10.4" y="6.1" width="1.6" height="0.7"></rect><rect x="12" y="5.5" width="1.6" height="0.7"></rect><rect x="8.5" y="9.5" width="3" height="1.4"></rect></g>
        <g fill="#f3e9c6" class="mood-furious"><rect x="2" y="4" width="1" height="1"><animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite"></animate></rect><rect x="17" y="6" width="1" height="1"><animate attributeName="opacity" values="0;1;0" dur="0.4s" repeatCount="indefinite"></animate></rect></g>
      </g>
    </svg>
