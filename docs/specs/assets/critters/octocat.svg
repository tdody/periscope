<svg data-limb="tentacle 16.6 12.4" data-limb-color="#24292f" data-hat="10 4 12" data-neck="11.6 4 16" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Octocat">
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current>; hide the others. Default shown: calm. An original pixel take on the octocat: cat head, octopus legs. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0.4 0;0 0;-0.4 0" dur="1.6s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
          <g fill="#24292f" stroke="#6e7781" stroke-width="1">
            <rect x="4" y="14" width="1" height="2"></rect><rect x="3" y="16" width="2" height="1"></rect>
            <rect x="7" y="14" width="1" height="3"></rect><rect x="6" y="17" width="2" height="1"></rect>
            <rect x="12" y="14" width="1" height="3"></rect><rect x="12" y="17" width="2" height="1"></rect>
            <rect x="15" y="14" width="1" height="2"></rect><rect x="15" y="16" width="2" height="1"></rect>
          </g>
          <g fill="#24292f">
            <rect x="4" y="14" width="1" height="2"></rect><rect x="3" y="16" width="2" height="1"></rect>
            <rect x="7" y="14" width="1" height="3"></rect><rect x="6" y="17" width="2" height="1"></rect>
            <rect x="12" y="14" width="1" height="3"></rect><rect x="12" y="17" width="2" height="1"></rect>
            <rect x="15" y="14" width="1" height="2"></rect><rect x="15" y="16" width="2" height="1"></rect>
          </g>
        </g>
        <g fill="#24292f" stroke="#6e7781" stroke-width="1">
          <rect x="4" y="2" width="1" height="2"></rect><rect x="5" y="3" width="1" height="1"></rect>
          <rect x="15" y="2" width="1" height="2"></rect><rect x="14" y="3" width="1" height="1"></rect>
          <rect x="4" y="4" width="12" height="1"></rect><rect x="3" y="5" width="14" height="7"></rect>
          <rect x="4" y="12" width="12" height="2"></rect>
        </g>
        <g fill="#24292f">
          <rect x="4" y="2" width="1" height="2"></rect><rect x="5" y="3" width="1" height="1"></rect>
          <rect x="15" y="2" width="1" height="2"></rect><rect x="14" y="3" width="1" height="1"></rect>
          <rect x="4" y="4" width="12" height="1"></rect><rect x="3" y="5" width="14" height="7"></rect>
          <rect x="4" y="12" width="12" height="2"></rect>
        </g>
        <g fill="#f4c7ad"><rect x="6" y="6" width="8" height="1"></rect><rect x="5" y="7" width="10" height="4"></rect><rect x="6" y="11" width="8" height="1"></rect></g>
        <rect x="7" y="8" width="2" height="2" fill="#2b1d16"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.9;0.95;1" dur="4.6s" repeatCount="indefinite"></animate><animate attributeName="y" values="8;8;9;8" keyTimes="0;0.9;0.95;1" dur="4.6s" repeatCount="indefinite"></animate></rect>
        <rect x="11" y="8" width="2" height="2" fill="#2b1d16"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.9;0.95;1" dur="4.6s" repeatCount="indefinite"></animate><animate attributeName="y" values="8;8;9;8" keyTimes="0;0.9;0.95;1" dur="4.6s" repeatCount="indefinite"></animate></rect>
        <g fill="#f3f5f8" class="mood-calm"><rect x="7" y="8" width="0.7" height="0.7"></rect><rect x="11" y="8" width="0.7" height="0.7"></rect></g>
        <g class="mood-calm"><rect x="9" y="10.4" width="2" height="0.6" fill="#2b1d16"></rect><rect x="5.4" y="10" width="1.2" height="0.6" fill="#e8909c"></rect><rect x="13.4" y="10" width="1.2" height="0.6" fill="#e8909c"></rect></g>
        <g fill="#2b1d16" class="mood-grumpy"><rect x="6.5" y="6.8" width="3" height="0.6"></rect><rect x="10.5" y="6.8" width="3" height="0.6"></rect><rect x="8.5" y="10.6" width="3" height="0.6"></rect></g>
        <g fill="#2b1d16" class="mood-furious"><rect x="6.4" y="6.4" width="1.6" height="0.6"></rect><rect x="8" y="7" width="1.6" height="0.6"></rect><rect x="10.4" y="7" width="1.6" height="0.6"></rect><rect x="12" y="6.4" width="1.6" height="0.6"></rect><rect x="8.5" y="10.2" width="3" height="1.2"></rect></g>
        <g fill="#f3e9c6" class="mood-furious"><rect x="1" y="4" width="1" height="1"><animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite"></animate></rect><rect x="18" y="5" width="1" height="1"><animate attributeName="opacity" values="0;1;0" dur="0.4s" repeatCount="indefinite"></animate></rect></g>
      </g>
    </svg>
