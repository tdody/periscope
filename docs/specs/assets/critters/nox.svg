<svg data-hat="10 5 9" data-neck="12 6 14" data-ink="#c6e05a" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Nox" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current> (and .mood-not-furious unless furious); hide the others. Default shown: calm. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.5;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
