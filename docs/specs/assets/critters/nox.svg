        <g class="face-worried" fill="#d5d8dc"><rect x="5.8" y="5.9" width="1.4" height="0.6"></rect><rect x="7.2" y="5.4" width="1.6" height="0.6"></rect><rect x="11.2" y="5.4" width="1.6" height="0.6"></rect><rect x="12.8" y="5.9" width="1.4" height="0.6"></rect></g>
