          <rect x="14" y="3" width="1" height="2"></rect><rect x="13" y="4" width="1" height="1"></rect>
          <rect x="5" y="5" width="10" height="1"></rect><rect x="4" y="6" width="12" height="5"></rect><rect x="5" y="11" width="10" height="1"></rect>
          <rect x="6" y="12" width="8" height="1"></rect><rect x="5" y="13" width="10" height="5"></rect>
        </g>
        <g fill="#f2a7c3" opacity="0.8"><rect x="5.2" y="4.2" width="0.6" height="0.7"></rect><rect x="14.2" y="4.2" width="0.6" height="0.7"></rect></g>
