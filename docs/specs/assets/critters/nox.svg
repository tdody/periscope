        <g fill="#1a1c20"><rect x="6" y="6" width="3" height="0"><animate attributeName="height" values="0;0;3;0" keyTimes="0;0.9;0.95;1" dur="4.8s" repeatCount="indefinite"></animate></rect><rect x="11" y="6" width="3" height="0"><animate attributeName="height" values="0;0;3;0" keyTimes="0;0.9;0.95;1" dur="4.8s" repeatCount="indefinite"></animate></rect></g>
