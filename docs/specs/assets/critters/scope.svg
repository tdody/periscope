<svg data-limb="arm 17 10.6 1.2" data-limb-color="#2a86b3" data-hat="10 6 12" data-neck="13 3 17" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Scope" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current> (and .mood-not-furious unless furious); hide the others. Default shown: calm. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
        <rect x="11" y="1" width="2" height="6" fill="#2a86b3"></rect>
        <rect x="11" y="1" width="5" height="2" fill="#2a86b3"></rect>
        <rect x="16" y="1" width="1" height="2" fill="#ffd166"><animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"></animate></rect>
        <rect x="1" y="9" width="2" height="4" fill="#2a86b3"></rect>
        <rect x="4" y="6" width="12" height="1" fill="#40b8ee"></rect>
        <rect x="3" y="7" width="14" height="8" fill="#40b8ee"></rect>
        <rect x="4" y="15" width="12" height="1" fill="#2a86b3"></rect>
        <rect x="5" y="7" width="3" height="1" fill="#7fd0f5"></rect>
        <rect x="6" y="9" width="2" height="2" fill="#0f1215"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"></animate><animate attributeName="y" values="9;9;10;9" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"></animate></rect>
        <rect x="12" y="9" width="2" height="2" fill="#0f1215"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"></animate><animate attributeName="y" values="9;9;10;9" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"></animate></rect>
        <g fill="#f3f5f8" class="mood-calm"><rect x="6" y="9" width="0.7" height="0.7"></rect><rect x="12" y="9" width="0.7" height="0.7"></rect></g>
        <g fill="#16384a" class="mood-grumpy"><rect x="5.5" y="7.9" width="3" height="0.7"></rect><rect x="11.5" y="7.9" width="3" height="0.7"></rect><rect x="8.5" y="12.2" width="3" height="0.7"></rect></g>
        <g fill="#16384a" class="mood-furious"><rect x="5.4" y="7.5" width="1.6" height="0.7"></rect><rect x="7" y="8.1" width="1.6" height="0.7"></rect><rect x="11.4" y="8.1" width="1.6" height="0.7"></rect><rect x="13" y="7.5" width="1.6" height="0.7"></rect><rect x="8.5" y="11.7" width="3" height="1.6"></rect></g>
        <g class="mood-calm"><rect x="8.4" y="11.6" width="0.7" height="0.7" fill="#16384a"></rect><rect x="9" y="12.2" width="2" height="0.7" fill="#16384a"></rect><rect x="10.9" y="11.6" width="0.7" height="0.7" fill="#16384a"></rect><rect x="4.4" y="11.6" width="1.5" height="0.8" fill="#f58967" opacity="0.7"></rect><rect x="14.1" y="11.6" width="1.5" height="0.8" fill="#f58967" opacity="0.7"></rect></g>
        <g class="legs">
          <rect x="5" y="16" width="2" height="2" fill="#2a86b3"></rect>
          <rect x="13" y="16" width="2" height="2" fill="#2a86b3"></rect>
        </g>
        <g fill="#8f9397" class="mood-furious"><rect x="3" y="3" width="1" height="1"><animate attributeName="y" values="4;1" dur="0.9s" repeatCount="indefinite"></animate></rect><rect x="6" y="2" width="1" height="1"><animate attributeName="y" values="4;0" dur="1.2s" repeatCount="indefinite"></animate></rect></g>
      </g>
    </svg>
