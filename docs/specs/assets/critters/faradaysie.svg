<svg data-limb="arm 16.4 9.4 1.2" data-limb-color="#6d1ba0" data-hat="10 6 10" data-neck="12.8 4 16" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Faradaysie" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current> (and .mood-not-furious unless furious); hide the others. Default shown: calm. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
        <g fill="#f72f96"><rect x="12" y="0" width="1" height="1"></rect><rect x="11" y="1" width="3" height="1"></rect><rect x="10" y="2" width="5" height="1"></rect><rect x="12" y="3" width="1" height="2"></rect></g>
        <g fill="#e4baff"><rect x="7" y="0" width="1" height="2"><animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"></animate></rect><rect x="5" y="2" width="5" height="1"><animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"></animate></rect><rect x="6" y="3" width="3" height="1"><animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"></animate></rect><rect x="7" y="4" width="1" height="1"><animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"></animate></rect></g>
        <g fill="#b641ff"><rect x="7" y="5" width="6" height="1"></rect><rect x="5" y="6" width="10" height="1"></rect><rect x="4" y="7" width="12" height="7"></rect><rect x="5" y="14" width="10" height="1"></rect></g>
        <rect x="6" y="15" width="8" height="1" fill="#6d1ba0"></rect>
        <rect x="6" y="6" width="3" height="1" fill="#e4baff"></rect>
        <rect x="5" y="7" width="1" height="2" fill="#e4baff"></rect>
        <rect x="7" y="11.5" width="6" height="2.5" fill="#fcb0d7"></rect>
        <g fill="#6d1ba0" class="hold-arms">
          <rect x="3" y="9" width="1" height="2"></rect><rect x="16" y="9" width="1" height="2"><animate attributeName="y" values="9;7.5;9" dur="1.3s" repeatCount="indefinite" calcMode="discrete"></animate></rect>
        </g>
        <g fill="#6d1ba0" class="legs">
          <rect x="6" y="16" width="2" height="1"></rect><rect x="12" y="16" width="2" height="1"></rect>
        </g>
        <rect x="6" y="8" width="2" height="2" fill="#240835"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.92;0.96;1" dur="4.3s" repeatCount="indefinite"></animate><animate attributeName="y" values="8;8;9;8" keyTimes="0;0.92;0.96;1" dur="4.3s" repeatCount="indefinite"></animate></rect>
        <rect x="12" y="8" width="2" height="2" fill="#240835"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.92;0.96;1" dur="4.3s" repeatCount="indefinite"></animate><animate attributeName="y" values="8;8;9;8" keyTimes="0;0.92;0.96;1" dur="4.3s" repeatCount="indefinite"></animate></rect>
        <g fill="#fdfaff" class="mood-calm"><rect x="6" y="8" width="0.7" height="0.7"></rect><rect x="12" y="8" width="0.7" height="0.7"></rect></g>
        <g class="mood-calm"><rect x="8.4" y="10.6" width="0.7" height="0.7" fill="#240835"></rect><rect x="9" y="11.2" width="2" height="0.7" fill="#240835"></rect><rect x="10.9" y="10.6" width="0.7" height="0.7" fill="#240835"></rect><rect x="4.4" y="10.4" width="1.5" height="0.8" fill="#f72f96" opacity="0.75"></rect><rect x="14.1" y="10.4" width="1.5" height="0.8" fill="#f72f96" opacity="0.75"></rect></g>
        <g fill="#240835" class="mood-grumpy"><rect x="5.5" y="6.9" width="3" height="0.7"></rect><rect x="11.5" y="6.9" width="3" height="0.7"></rect><rect x="8.5" y="11" width="3" height="0.7"></rect></g>
        <g fill="#240835" class="mood-furious"><rect x="5.4" y="6.5" width="1.6" height="0.7"></rect><rect x="7" y="7.1" width="1.6" height="0.7"></rect><rect x="11.4" y="7.1" width="1.6" height="0.7"></rect><rect x="13" y="6.5" width="1.6" height="0.7"></rect><rect x="8.5" y="10.5" width="3" height="1.6"></rect></g>
        <g fill="#f72f96" class="mood-furious"><rect x="2" y="4" width="1" height="2"><animate attributeName="opacity" values="1;0;1" dur="0.3s" repeatCount="indefinite"></animate></rect><rect x="17" y="3" width="1" height="2"><animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite"></animate></rect><rect x="1" y="12" width="1" height="1"><animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite"></animate></rect><rect x="18" y="13" width="1" height="1"><animate attributeName="opacity" values="1;0;1" dur="0.3s" repeatCount="indefinite"></animate></rect></g>
      </g>
    </svg>
