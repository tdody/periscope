<svg data-hat="10 5 10" data-neck="12.6 4 16" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Ember" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current> (and .mood-not-furious unless furious); hide the others. Default shown: calm. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
        <g fill="#ffd9a0"><rect x="4" y="2" width="1" height="2"></rect><rect x="5" y="3" width="1" height="2"></rect><rect x="15" y="2" width="1" height="2"></rect><rect x="14" y="3" width="1" height="2"></rect></g>
        <rect x="6" y="4" width="8" height="1" fill="#e8574f"></rect>
        <rect x="5" y="5" width="10" height="1" fill="#e8574f"></rect>
        <rect x="4" y="6" width="12" height="8" fill="#e8574f"></rect>
        <rect x="5" y="14" width="10" height="1" fill="#e8574f"></rect>
        <rect x="6" y="15" width="8" height="1" fill="#b8403a"></rect>
        <rect x="8" y="11" width="4" height="3" fill="#ff9a8f"></rect>
        <rect x="6" y="5" width="2" height="1" fill="#ff9a8f"></rect>
        <g fill="#b8403a">
          <rect x="3" y="9" width="1" height="2"></rect><rect x="16" y="9" width="1" height="2"></rect>
          <rect x="6" y="16" width="2" height="1"></rect><rect x="12" y="16" width="2" height="1"></rect>
        </g>
        <g fill="#b8403a">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.5;0 0" dur="0.8s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
          <rect x="16" y="13" width="1" height="1"></rect><rect x="17" y="12" width="1" height="1"></rect><rect x="18" y="10" width="1" height="2"></rect><rect x="17" y="9" width="1" height="1"></rect><rect x="19" y="9" width="1" height="1"></rect><rect x="18" y="8" width="1" height="1"></rect>
        </g>
        <rect x="7" y="7" width="2" height="2" fill="#3a1312"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.88;0.94;1" dur="4s" repeatCount="indefinite"></animate><animate attributeName="y" values="7;7;8;7" keyTimes="0;0.88;0.94;1" dur="4s" repeatCount="indefinite"></animate></rect>
        <rect x="11" y="7" width="2" height="2" fill="#3a1312"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.88;0.94;1" dur="4s" repeatCount="indefinite"></animate><animate attributeName="y" values="7;7;8;7" keyTimes="0;0.88;0.94;1" dur="4s" repeatCount="indefinite"></animate></rect>
        <g fill="#f3f5f8" class="mood-calm"><rect x="7" y="7" width="0.7" height="0.7"></rect><rect x="11" y="7" width="0.7" height="0.7"></rect></g>
        <g class="mood-calm"><rect x="8.4" y="9.6" width="0.7" height="0.7" fill="#3a1312"></rect><rect x="9" y="10.2" width="2" height="0.7" fill="#3a1312"></rect><rect x="10.9" y="9.6" width="0.7" height="0.7" fill="#3a1312"></rect><rect x="10.2" y="10.9" width="0.7" height="0.7" fill="#ffd9a0"></rect></g>
        <g fill="#3a1312" class="mood-grumpy"><rect x="6.5" y="5.9" width="3" height="0.7"></rect><rect x="10.5" y="5.9" width="3" height="0.7"></rect><rect x="8.5" y="10" width="3" height="0.7"></rect></g>
        <g fill="#3a1312" class="mood-furious"><rect x="6.4" y="5.6" width="1.6" height="0.7"></rect><rect x="8" y="6.2" width="1.6" height="0.7"></rect><rect x="10.4" y="6.2" width="1.6" height="0.7"></rect><rect x="12" y="5.6" width="1.6" height="0.7"></rect><rect x="8.5" y="9.5" width="3" height="1.5"></rect></g>
        <g class="mood-furious"><rect x="9" y="1" width="2" height="2" fill="#ffd166"><animate attributeName="height" values="2;1;2" dur="0.3s" repeatCount="indefinite"></animate></rect><rect x="9.5" y="0" width="1" height="1" fill="#f58967"></rect></g>
      </g>
    </svg>
