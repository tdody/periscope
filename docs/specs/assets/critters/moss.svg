<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Moss" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current> (and .mood-not-furious unless furious); hide the others. Default shown: calm. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
        <g fill="#2e9a56">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.5;0 0" dur="1.6s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
          <rect x="7" y="3" width="2" height="1"></rect><rect x="9.5" y="2" width="1.5" height="2"></rect><rect x="11.5" y="3" width="2" height="1"></rect>
        </g>
        <rect x="7" y="4" width="6" height="1" fill="#47cf79"></rect>
        <rect x="6" y="5" width="8" height="1" fill="#47cf79"></rect>
        <rect x="5" y="6" width="10" height="9" fill="#47cf79"></rect>
        <rect x="6" y="15" width="8" height="1" fill="#2e9a56"></rect>
        <g fill="#9ae8b6"><rect x="6" y="6" width="1" height="1"></rect><rect x="12" y="5" width="1" height="1"></rect><rect x="13" y="12" width="1" height="1"></rect><rect x="6" y="13" width="1" height="1"></rect></g>
        <rect x="4" y="10" width="1" height="3" fill="#2e9a56"></rect>
        <rect x="15" y="10" width="1" height="3" fill="#2e9a56"><animate attributeName="y" values="10;8;10" dur="1.2s" repeatCount="indefinite" calcMode="discrete"></animate></rect>
        <g fill="#2e9a56"><rect x="6" y="16" width="2" height="1"></rect><rect x="12" y="16" width="2" height="1"></rect></g>
        <rect x="8" y="7" width="4" height="3" fill="#f3f5f8"></rect>
        <rect x="9" y="7.5" width="2" height="2" fill="#0f2e1b"><animate attributeName="x" values="9;9;8.4;9.6;9" keyTimes="0;0.5;0.6;0.8;1" dur="6s" repeatCount="indefinite"></animate></rect>
        <rect x="8" y="7" width="4" height="0" fill="#47cf79"><animate attributeName="height" values="0;0;3;0" keyTimes="0;0.9;0.95;1" dur="5.2s" repeatCount="indefinite"></animate></rect>
        <g class="mood-calm"><rect x="8.4" y="11.4" width="0.7" height="0.7" fill="#0f2e1b"></rect><rect x="9" y="12" width="2" height="0.7" fill="#0f2e1b"></rect><rect x="10.9" y="11.4" width="0.7" height="0.7" fill="#0f2e1b"></rect><rect x="6" y="11" width="1.3" height="0.7" fill="#f2a7c3"></rect><rect x="12.7" y="11" width="1.3" height="0.7" fill="#f2a7c3"></rect></g>
        <g class="mood-grumpy"><rect x="8" y="7" width="4" height="1.3" fill="#2e9a56"></rect><rect x="8.5" y="12" width="3" height="0.7" fill="#0f2e1b"></rect></g>
        <g fill="#0f2e1b" class="mood-furious"><rect x="7.6" y="5.6" width="1.6" height="0.7"></rect><rect x="9.2" y="6.2" width="1.6" height="0.7"></rect><rect x="10.8" y="5.6" width="1.6" height="0.7"></rect><rect x="8.5" y="11.4" width="3" height="1.6"></rect></g>
      </g>
    </svg>
