<svg data-limb="arm 17.4 9.4 1.2" data-limb-color="#d1a92b" data-hat="10 6 10" data-neck="12.4 3 17" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" width="200" height="200" shape-rendering="crispEdges" role="img" aria-label="Volt" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.mood-grumpy,.mood-furious{display:none}</style>
  <!-- Mood layers: show .mood-<current> (and .mood-not-furious unless furious); hide the others. Default shown: calm. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.5;0 0" dur="1.2s" data-bob="calm 1.2s · grumpy 0.6s · furious 0.2s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
        <g fill="#d1a92b"><rect x="9" y="4" width="1" height="2"></rect><rect x="10" y="3" width="1" height="1"></rect><rect x="9" y="2" width="1" height="1"></rect><rect x="10" y="1" width="1" height="1"></rect></g>
        <rect x="10" y="0" width="1" height="1" fill="#fff1a8"><animate attributeName="opacity" values="1;0.2;1;1" dur="1.1s" repeatCount="indefinite"></animate></rect>
        <rect x="5" y="6" width="10" height="1" fill="#f5d547"></rect>
        <rect x="3" y="7" width="14" height="7" fill="#f5d547"></rect>
        <rect x="4" y="14" width="12" height="1" fill="#d1a92b"></rect>
        <rect x="6" y="7" width="3" height="1" fill="#fff1a8"></rect>
        <g fill="#fff1a8"><rect x="10" y="12" width="1" height="1"></rect><rect x="9" y="13" width="1" height="1"></rect></g>
        <g fill="#d1a92b" class="hold-arms">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="0.7s" repeatCount="indefinite" calcMode="discrete"></animateTransform>
          <rect x="2" y="9" width="1" height="2"></rect><rect x="17" y="9" width="1" height="2"></rect>
        </g>
        <g fill="#d1a92b"><rect x="5" y="15" width="3" height="1"></rect><rect x="12" y="15" width="3" height="1"></rect></g>
        <rect x="6" y="8" width="2" height="2" fill="#3a2f10"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.93;0.97;1" dur="3.8s" repeatCount="indefinite"></animate><animate attributeName="y" values="8;8;9;8" keyTimes="0;0.93;0.97;1" dur="3.8s" repeatCount="indefinite"></animate></rect>
        <rect x="12" y="8" width="2" height="2" fill="#3a2f10"><animate attributeName="height" values="2;2;0.4;2" keyTimes="0;0.93;0.97;1" dur="3.8s" repeatCount="indefinite"></animate><animate attributeName="y" values="8;8;9;8" keyTimes="0;0.93;0.97;1" dur="3.8s" repeatCount="indefinite"></animate></rect>
        <g fill="#f3f5f8" class="mood-calm"><rect x="6" y="8" width="0.7" height="0.7"></rect><rect x="12" y="8" width="0.7" height="0.7"></rect></g>
        <g class="mood-calm"><rect x="8.4" y="10.2" width="0.7" height="0.7" fill="#3a2f10"></rect><rect x="9" y="10.8" width="2" height="0.7" fill="#3a2f10"></rect><rect x="10.9" y="10.2" width="0.7" height="0.7" fill="#3a2f10"></rect><rect x="4.2" y="10.2" width="1.5" height="0.8" fill="#f58967" opacity="0.7"></rect><rect x="14.3" y="10.2" width="1.5" height="0.8" fill="#f58967" opacity="0.7"></rect></g>
        <g fill="#3a2f10" class="mood-grumpy"><rect x="5.5" y="6.9" width="3" height="0.7"></rect><rect x="11.5" y="6.9" width="3" height="0.7"></rect><rect x="8.5" y="10.6" width="3" height="0.7"></rect></g>
        <g fill="#3a2f10" class="mood-furious"><rect x="5.4" y="6.5" width="1.6" height="0.7"></rect><rect x="7" y="7.1" width="1.6" height="0.7"></rect><rect x="11.4" y="7.1" width="1.6" height="0.7"></rect><rect x="13" y="6.5" width="1.6" height="0.7"></rect><rect x="8.5" y="10" width="3" height="1.6"></rect></g>
        <g fill="#fff1a8" class="mood-furious"><rect x="1" y="3" width="1" height="2"><animate attributeName="opacity" values="1;0;1" dur="0.3s" repeatCount="indefinite"></animate></rect><rect x="18" y="4" width="1" height="2"><animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite"></animate></rect></g>
      </g>
    </svg>
